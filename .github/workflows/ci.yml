name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Domain tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore CompendioCalc.Tests/CompendioCalc.Tests.csproj --source https://api.nuget.org/v3/index.json

      - name: Build tests
        run: dotnet build CompendioCalc.Tests/CompendioCalc.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CompendioCalc.Tests/CompendioCalc.Tests.csproj --configuration Release --no-build

      - name: Check vulnerable packages
        run: dotnet list CompendioCalc.Tests/CompendioCalc.Tests.csproj package --vulnerable --include-transitive --no-restore --source https://api.nuget.org/v3/index.json

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript,python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
