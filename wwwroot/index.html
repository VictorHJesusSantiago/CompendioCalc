<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Compêndio de Equações</title>
    <base href="/" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
</head>
<body>
    <div id="app">
        <div class="splash-screen">
            <div class="splash-content">
                <div class="splash-symbol">∑</div>
                <div class="splash-title">Compêndio de Equações</div>
                <div class="splash-sub">Carregando…</div>
                <div class="splash-loader">
                    <div class="splash-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Um erro ocorreu.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/report-export.js"></script>
    <script>
        Blazor.start();
    </script>
</body>
</html>
